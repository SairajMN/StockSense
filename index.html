<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="utf-8" />
  <title>StockSense — Warehouse Operations Command Deck &amp; Inventory Telemetry</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="StockSense Warehouse Operations Command Deck and Inventory Telemetry Ledger. Real-time SKU tracking, dock dispatch, and multi-bay replenishment." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#b84328",
            "primary-container": "#b84328",
            "secondary": "#536443",
            "secondary-container": "#d3e6bd",
            "surface": "#f4f0e6",
            "surface-container": "#faf7f0",
            "surface-container-low": "#efe9dc",
            "surface-container-high": "#ebe5d8",
            "outline-variant": "#cfc5b4",
            "on-surface": "#262421",
            "tertiary": "#565145"
          },
          fontFamily: {
            mono: ["Courier Prime", "monospace"],
            body: ["DM Sans", "sans-serif"]
          }
        }
      }
    };
  </script>

  <!-- StockSense Kraft Ledger Design System CSS -->
  <link rel="stylesheet" href="css/kraft-ledger.css" />
</head>
<body class="bg-[#f4f0e6] text-[#262421] font-body antialiased selection:bg-[#ffdad2] selection:text-[#3d0600]">
  <!-- Application Root Mount Point -->
  <div id="app"></div>

  <!-- Main ES Module Script -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
